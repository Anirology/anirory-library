services:
  - type: web
    name: anirory-library-api-anirology
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: anirory-library-db-anirology
          property: connectionString
      - key: CORS_ORIGINS
        value: https://anirology.github.io,http://localhost:5173
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: anirory-library-db-anirology
    databaseName: anirory
    user: anirory
    plan: free
